        },
        en: {

            updated: 'Last updated: 4 May 2026',
            contactLink: 'Contact',
            backLink: 'Back to the site',
            meta: 'Privacy and cookie policy for the Pronto Pizza da Fabio website in Porlezza.',
            sections: [
                ['Website owner', ['Pronto Pizza da Fabio, Via Giuseppe Garibaldi 31, 22018 Porlezza (CO), Italy. Contact: <a href="tel:+39034472393">+39 0344 72393</a>.']],
                ['Data processed', ['This website is a static showcase site. It does not provide user accounts, online carts, payments, newsletters or profiling systems. When you browse the site, technical data needed to operate the website may be processed, such as IP address, browser type, device, date and time of the request, through normal hosting provider logs.', 'If you call the restaurant or open external links, data is processed by the relevant services or applications under their own policies.']],
                ['Cookies and similar technologies', ['The site does not use profiling cookies, advertising pixels, Google Analytics, Meta Pixel, Hotjar, Clarity or similar tools. The language preference may be stored in the browser through <code>localStorage</code> using the key <code>pp-lang</code>: it is used only to remember the selected language and is not used to track users.']],
                ['Third-party services', ['The site loads fonts from Google Fonts. Google Maps is not loaded automatically: it starts only when you select the "Load map" button. Links to Facebook and Tripadvisor lead to external platforms, which may process data under their own policies.']],

                ['Rights', ['You may request information about personal data concerning you, correction or deletion where applicable. You may also delete locally stored browser data at any time through your browser settings.']]
            ]
        },
        de: {
            title: 'Datenschutz- und Cookie-Richtlinie',
            updated: 'Letzte Aktualisierung: 4. Mai 2026',
            contactLink: 'Kontakt',
            backLink: 'Zurueck zur Website',
            meta: 'Datenschutz- und Cookie-Richtlinie der Website von Pronto Pizza da Fabio in Porlezza.',
            sections: [
                ['Betreiber der Website', ['Pronto Pizza da Fabio, Via Giuseppe Garibaldi 31, 22018 Porlezza (CO), Italien. Kontakt: <a href="tel:+39034472393">+39 0344 72393</a>.']],
                ['Verarbeitete Daten', ['Diese Website ist eine statische Praesenzseite. Es gibt keine Benutzerkonten, Online-Warenkoerbe, Zahlungen, Newsletter oder Profiling-Systeme. Beim Besuch der Website koennen technische Daten verarbeitet werden, die fuer den Betrieb der Website erforderlich sind, z. B. IP-Adresse, Browsertyp, Geraet, Datum und Uhrzeit der Anfrage, ueber die normalen Protokolle des Hosting-Anbieters.', 'Wenn du das Restaurant anrufst oder externe Links oeffnest, werden Daten von den jeweiligen Diensten oder Anwendungen nach deren eigenen Richtlinien verarbeitet.']],
                ['Cookies und aehnliche Technologien', ['Die Website verwendet keine Profiling-Cookies, Werbepixel, Google Analytics, Meta Pixel, Hotjar, Clarity oder aehnliche Tools. Die Sprachpraeferenz kann im Browser ueber <code>localStorage</code> mit dem Schluessel <code>pp-lang</code> gespeichert werden: Sie dient nur dazu, die gewaehlte Sprache zu merken, und wird nicht zur Nachverfolgung verwendet.']],

                ['Rechtsgrundlage und Zwecke', ['Technische Daten werden verarbeitet, um die Website verfuegbar und sicher bereitzustellen. Daten, die freiwillig telefonisch oder ueber externe Dienste angegeben werden, werden nur verwendet, um die Anfrage zu beantworten oder eine Reservierung/Bestellung zu verwalten.']],
                ['Aufbewahrung', ['Technische Daten in Hosting-Protokollen werden so lange aufbewahrt, wie es fuer Sicherheit, Wartung und Betrieb der Website erforderlich ist. Daten, die von Drittanbietern erhoben werden, unterliegen deren eigenen Aufbewahrungsrichtlinien.']],
                ['Rechte', ['Du kannst Auskunft ueber dich betreffende personenbezogene Daten sowie Berichtigung oder Loeschung verlangen, soweit dies anwendbar ist. Lokal im Browser gespeicherte Daten kannst du jederzeit ueber die Browsereinstellungen loeschen.']]
            ]
        },
        fr: {
            title: 'Politique de confidentialite et cookies',
            updated: 'Derniere mise a jour : 4 mai 2026',
            contactLink: 'Contact',
            backLink: 'Retour au site',
            meta: 'Politique de confidentialite et cookies du site Pronto Pizza da Fabio a Porlezza.',
            sections: [
                ['Responsable du site', ['Pronto Pizza da Fabio, Via Giuseppe Garibaldi 31, 22018 Porlezza (CO), Italie. Contact : <a href="tel:+39034472393">+39 0344 72393</a>.']],
                ['Donnees traitees', ['Ce site est un site vitrine statique. Il ne propose pas de comptes utilisateurs, paniers en ligne, paiements, newsletter ou systemes de profilage. Lors de la navigation, des donnees techniques necessaires au fonctionnement du site peuvent etre traitees, comme l&apos;adresse IP, le type de navigateur, l&apos;appareil, la date et l&apos;heure de la requete, via les journaux habituels du fournisseur d&apos;hebergement.', 'Si vous appelez le restaurant ou ouvrez des liens externes, les donnees sont traitees par les services ou applications concernes selon leurs propres politiques.']],
                ['Cookies et technologies similaires', ['Le site n&apos;utilise pas de cookies de profilage, pixels publicitaires, Google Analytics, Meta Pixel, Hotjar, Clarity ou outils similaires. La preference de langue peut etre enregistree dans le navigateur via <code>localStorage</code> avec la cle <code>pp-lang</code> : elle sert uniquement a memoriser la langue choisie et n&apos;est pas utilisee pour suivre l&apos;utilisateur.']],
                ['Services tiers', ['Le site charge des polices depuis Google Fonts. Google Maps n&apos;est pas charge automatiquement : la carte demarre uniquement lorsque vous selectionnez le bouton "Charger la carte". Les liens vers Facebook et Tripadvisor menent a des plateformes externes, qui peuvent traiter des donnees selon leurs propres politiques.']],
                ['Base juridique et finalites', ['Les donnees techniques sont traitees afin de rendre le site disponible et securise. Les donnees fournies volontairement par telephone ou via des services externes sont utilisees uniquement pour repondre a la demande de l&apos;utilisateur ou gerer une reservation/commande.']],
                ['Conservation', ['Les donnees techniques dans les journaux d&apos;hebergement sont conservees pendant la duree necessaire a la securite, a la maintenance et au fonctionnement du site. Les donnees collectees par des services tiers suivent leurs propres politiques de conservation.']],
                ['Droits', ['Vous pouvez demander des informations sur les donnees personnelles vous concernant, leur rectification ou leur suppression lorsque cela est applicable. Vous pouvez egalement supprimer a tout moment les donnees stockees localement via les parametres de votre navigateur.']]
            ]
        }
    };

    function render(lang) {
        const data = copy[lang] || copy[fallback];
        document.documentElement.lang = lang;
        document.title = 'Privacy & Cookie Policy - Pronto Pizza da Fabio';
        const meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute('content', data.meta);

        document.querySelector('[data-privacy-field="title"]').textContent = data.title;
        document.querySelector('[data-privacy-field="updated"]').textContent = data.updated;
        document.querySelector('[data-privacy-field="contactLink"]').textContent = data.contactLink;
        document.querySelector('[data-privacy-field="backLink"]').textContent = data.backLink;

        const content = document.getElementById('privacyContent');
        content.innerHTML = data.sections.map(section => {
            return '<h2>' + section[0] + '</h2>' + section[1].map(p => '<p>' + p + '</p>').join('');
        }).join('');

        document.querySelectorAll('[data-privacy-lang] button').forEach(button => {
            button.classList.toggle('is-active', button.dataset.lang === lang);
        });

        try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) {}
    }

    let initial = fallback;
    try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored && copy[stored]) initial = stored;
    } catch (e) {}
    if (initial === fallback) {
        const browser = (navigator.language || fallback).slice(0, 2).toLowerCase();
        if (copy[browser]) initial = browser;
    }

    document.querySelectorAll('[data-privacy-lang] button').forEach(button => {
        button.addEventListener('click', () => render(button.dataset.lang));
    });
    render(initial);
})();
</script>
<script src="js/script.js"></script>
</body>
</html>
